appId: io.guion.kepos
---
- launchApp
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      - tapOn:
          id: 'leave-home-button'
- extendedWaitUntil:
    visible:
      id: 'create-home-button'
    timeout: 60000
- tapOn:
    id: 'quick-scan-home-qr-button'
- assertVisible:
    id: 'qr-scanner-overlay'
- tapOn:
    id: 'qr-scanner-cancel'
- tapOn:
    id: 'people-setup-toggle'
- tapOn:
    id: 'scan-profile-qr-button'
- assertVisible:
    id: 'qr-scanner-overlay'
- tapOn:
    id: 'qr-scanner-cancel'
- tapOn:
    id: 'create-home-button'
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 20000
- assertVisible:
    id: 'chat-tab'
- tapOn:
    id: 'treehole-tab'
- assertVisible: 'No posts yet'
